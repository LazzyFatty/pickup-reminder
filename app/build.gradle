plugins { id 'com.android.application' }

android {
    namespace 'ren.haom.pikeupcode'
    compileSdk 35
    defaultConfig {
        applicationId 'ren.haom.pikeupcode'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.register('parserCheck', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files("${buildDir}/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes", "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes")
    mainClass = 'ren.haom.pikeupcode.SmsParserCheck'
}
